<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient for Text & Glows -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>

    <!-- Dynamic Pulse Animations -->
    <style>
      .pulse-node {
        animation: pulse 3s infinite alternate ease-in-out;
      }
      .pulse-node-2 {
        animation: pulse 4s infinite alternate ease-in-out 1.5s;
      }
      .float-card {
        animation: float 6s infinite ease-in-out alternate;
      }
      .glow-path {
        stroke-dasharray: 10, 15;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.4; }
        100% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="400" fill="url(#grid)" rx="16"/>

  <!-- Dynamic Dynamic Glow Orbs in Background (Non-Obstructing) -->
  <circle cx="150" cy="100" r="180" fill="#38bdf8" opacity="0.08" class="pulse-node" />
  <circle cx="1050" cy="300" r="220" fill="#c084fc" opacity="0.08" class="pulse-node-2" />

  <!-- Animated Tech Flow Lines (In Background) -->
  <path d="M -50 320 Q 300 280 600 350 T 1250 290" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" class="glow-path"/>
  <path d="M -50 340 Q 350 380 700 310 T 1250 360" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.2" class="glow-path"/>

  <!-- Decorative Tech Badges / Pills on Sides (Foreground-Safe Zone) -->
  <g class="float-card" transform="translate(900, 60)">
    <rect width="240" height="60" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="35" cy="30" r="14" fill="#38bdf8" opacity="0.2"/>
    <text x="35" y="35" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">📦</text>
    <text x="65" y="28" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">OCI &amp; Helm</text>
    <text x="65" y="44" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">Native Packages</text>
  </g>

  <g class="float-card" transform="translate(930, 150)">
    <rect width="220" height="60" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="35" cy="30" r="14" fill="#818cf8" opacity="0.2"/>
    <text x="35" y="35" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">⚡</text>
    <text x="65" y="28" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Serverless</text>
    <text x="65" y="44" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">App Catalogs</text>
  </g>

  <g class="float-card" transform="translate(870, 240)">
    <rect width="250" height="60" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="35" cy="30" r="14" fill="#c084fc" opacity="0.2"/>
    <text x="35" y="35" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">🛡️</text>
    <text x="65" y="28" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Supply Chain</text>
    <text x="65" y="44" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">Security &amp; Signing</text>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (CLEAR, UNCOVERED & HIGH CONTRAST) -->
  <g transform="translate(70, 140)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1f6feb" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="140" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME REGISTRY</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">
      Awesome Serverless
    </text>
    <text x="0" y="135" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">
      Application Registry
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="180" fill="#9198a1" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16">
      Top SaaS Application Catalogs, Container Registries &amp; Self-Hosted Artifact Hubs
    </text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accentGrad)" rx="3"/>
</svg>
